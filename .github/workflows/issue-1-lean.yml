name: Lean 4 Proposition 3 check

on:
  push:
    branches: [audit/issue-1-finalization-20261122]
    paths:
      - "formal/**"
      - "lakefile.toml"
      - "lean-toolchain"
      - ".github/workflows/issue-1-lean.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  algebra:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4 toolchain
        run: |
          curl --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh |
            sh -s -- -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lake" --version
      - name: Fetch pinned Mathlib dependencies
        run: |
          lake update
          lake exe cache get
      - name: Check all exact algebraic theorems
        run: |
          set -o pipefail
          lake env lean formal/Proposition3.lean | tee lean-proof.log
          if grep -q 'sorryAx' lean-proof.log; then
            echo "Lean axiom audit found sorryAx"; exit 1
          fi
      - name: Reject executable proof holes
        run: |
          if grep -nE '^[[:space:]]*(sorry|admit)([[:space:]]|$)' formal/Proposition3.lean; then
            echo "Unexpected proof hole"; exit 1
          fi
